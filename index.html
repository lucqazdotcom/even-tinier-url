<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITS TINY</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
        <main id="main">
            <section class="headerSection">
                <h1 class="headerSection_header">Super tiny url</h1>
            </section>
            <section class="formSection">
                <form class="formSection_form">
                    <label id="formLabel" for="">Long Url</label>
                    <input id="formInput" name="formInput" type="text">
                    <button type="submit">Press this</button>
                </form>
            </section>
            <section class="linkSection">
                <div class="linkSection_container">
                    <p class="linkSection_container-title"></p>
                    <div class="linkSection_container-linkBox">
                        <a href="" class="linkSection_container-anchor">
                            <span
                                class="linkSection_container-generatedLink"></span>
                        </a>
                    </div>
                </div>
            </section>
            <section class="tinyRetriever">
                <button class="tinyRetriever_button" type="button">Retrieve</button>
            </section>
        </main>
        <script src="scripts/main.js"></script>
    </body>
</html>
